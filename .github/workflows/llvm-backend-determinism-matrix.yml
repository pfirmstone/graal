# -----------------------------------------------------------------------------
#
# Cross-platform reproducible-build matrix for the Native Image LLVM backend.
#
# Scope
# -----
#   This is the BROAD sweep complementing the focused per-push workflow at
#   llvm-backend-determinism.yml.  It runs the same `mx llvm-backend-
#   determinism-test` gate on every supported host independently, with both
#   the default and the --with-debug-info variants.  Each matrix cell is
#   self-contained: a build and its repeat must produce byte-identical
#   intermediates and final binary, but the workflow does NOT compare bytes
#   across cells (that is not a property the LLVM backend currently
#   targets; different target triples, link scripts and debug source paths
#   make cross-cell equality unachievable in general).
#
#   What the matrix catches:
#     * A platform-specific source of nondeterminism that the baseline
#       ubuntu-22.04 run happens not to exercise (e.g. macOS Finder
#       extended-attribute injection into the temp directory).
#     * A glibc version skew between ubuntu-22.04 and ubuntu-24.04 that
#       changes deflate stream timing in a way that leaks into binary
#       layout.
#     * A regression that is masked by Linux thread-scheduling but exposed
#       under macOS Grand Central Dispatch's different worker pool.
#
# Trigger policy
# --------------
#   * Manual workflow_dispatch.
#   * Weekly schedule (Mondays 04:00 UTC) so a slow regression doesn't
#     sit dormant for months.
#   * Push/PR that touches THIS workflow file (self-test).
#
#   It does NOT trigger on every LLVM-backend source change; the focused
#   single-platform workflow does that.

name: LLVM Backend Determinism (matrix)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'    # Mondays 04:00 UTC
  push:
    paths:
      - '.github/workflows/llvm-backend-determinism-matrix.yml'
  pull_request:
    paths:
      - '.github/workflows/llvm-backend-determinism-matrix.yml'

permissions:
  contents: read

concurrency:
  group: llvm-backend-determinism-matrix-${{ github.ref }}
  cancel-in-progress: false   # weekly runs should never cancel each other

jobs:
  determinism-matrix:
    name: ${{ matrix.host }} ${{ matrix.variant }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 120

    strategy:
      fail-fast: false   # one platform's failure must not hide another's pass
      matrix:
        # Host runners supported by GitHub Actions today on which the
        # Native Image LLVM backend can be built.  Each host runs both
        # the default and the --with-debug-info variant so a debug-DWARF
        # regression is caught separately from a base-pipeline regression.
        #
        # macos-13 (x86_64) was deliberately dropped: GitHub has retired
        # public macos-13 runners.  Apple Silicon macos-14 covers the
        # Darwin ARM path; Darwin x86_64 LLVM-backend coverage would need
        # a self-hosted runner.
        host:
          - ubuntu-22.04
          - ubuntu-24.04
          - macos-14          # Apple Silicon (arm64)
        variant:
          - ''                # default
          - '--with-debug-info'

    steps:
      - name: Checkout graal
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up environment variables
        shell: bash
        run: |
          echo "GRAALVM_HOME=${{ github.workspace }}/graalvm" >> ${GITHUB_ENV}
          echo "JAVA_HOME=${{ github.workspace }}/labsjdk" >> ${GITHUB_ENV}
          echo "MX_GIT_CACHE=refcache" >> ${GITHUB_ENV}
          echo "MX_PATH=${{ github.workspace }}/mx" >> ${GITHUB_ENV}
          echo "MX_PYTHON=python3.8" >> ${GITHUB_ENV}
          echo "MX_VERSION=$(jq -r '.mx_version' common.json)" >> ${GITHUB_ENV}
          echo "LANG=en_US.UTF-8" >> ${GITHUB_ENV}

      - name: Checkout graalvm/mx
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: graalvm/mx
          ref: ${{ env.MX_VERSION }}
          path: ${{ env.MX_PATH }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.8'

      - name: Fetch LabsJDK
        shell: bash
        run: |
          mkdir jdk-dl
          ${MX_PATH}/mx --java-home= fetch-jdk --jdk-id labsjdk-ce-latest --to jdk-dl --alias ${JAVA_HOME}

      - name: Build GraalVM with LLVM backend enabled
        shell: bash
        run: |
          cd vm
          MX_ARGS=(
            "--java-home" "${JAVA_HOME}"
            "--dy" "/substratevm"
            "--native-images=native-image"
            "--components=Native Image,Native Image LLVM Backend"
          )
          ${MX_PATH}/mx "${MX_ARGS[@]}" build
          ln -s "$(${MX_PATH}/mx "${MX_ARGS[@]}" graalvm-home)" "${GRAALVM_HOME}"

      - name: Show platform + GraalVM version info
        shell: bash
        run: |
          echo "= uname -a ===================="
          uname -a
          echo "==============================="
          echo "= 'java --version' ============"
          "${GRAALVM_HOME}/bin/java" --version
          echo "==============================="
          echo "= 'native-image --version' ===="
          "${GRAALVM_HOME}/bin/native-image" --version
          echo "==============================="

      - name: Run llvm-backend-determinism-test (${{ matrix.variant || 'default' }})
        shell: bash
        run: |
          cd substratevm
          ${MX_PATH}/mx --java-home "${JAVA_HOME}" --dy /substratevm \
            llvm-backend-determinism-test ${{ matrix.variant }}

      - name: Upload temp dirs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Disambiguate so all matrix cells can upload without collision.
          name: llvm-backend-determinism-${{ matrix.host }}-${{ matrix.variant && 'debug' || 'default' }}
          # svmbuild_dir(suite) actually resolves to
          # substratevm/mxbuild/jdk<release>/svmbuild, not substratevm/svmbuild.
          path: |
            substratevm/mxbuild/**/svmbuild/llvm-backend-determinism-*/
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: Matrix summary
    runs-on: ubuntu-22.04
    needs: determinism-matrix
    if: always()
    steps:
      - name: Report matrix result
        shell: bash
        run: |
          # ${{ needs.determinism-matrix.result }} is the aggregate result for
          # the whole strategy.  Without this aggregator, GitHub's UI would
          # show 8 independent green/red dots; this gives one verdict to
          # gate downstream automation on.
          result='${{ needs.determinism-matrix.result }}'
          echo "Matrix aggregate result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::At least one LLVM-backend determinism matrix cell failed."
            exit 1
          fi
