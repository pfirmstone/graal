# -----------------------------------------------------------------------------
#
# Reproducible-build gate for the Native Image LLVM backend.
#
# What this workflow does
# -----------------------
#   1. Builds GraalVM CE for JDK with the LLVM backend tool component enabled
#      (--components 'Native Image,Native Image LLVM Backend').
#   2. Runs `mx llvm-backend-determinism-test`, which compiles a trivial
#      HelloWorld twice with `--tool:llvm-backend -H:TempDirectory=<dir>` and
#      asserts byte-for-byte equality of every intermediate LLVM artefact
#      (f*.bc, b*.bc, b*o.bc, b*.o, llvm.o) and of the final native binary.
#   3. On failure, the per-stage hash lists from both runs are dumped so that
#      any future regression is diagnosed at the boundary where it first
#      appears.
#
# Why this exists
# ---------------
#   Until commit 197c7aa, LLVMNativeImageCodeCache.writeBitcode assigned the
#   per-function bitcode file id from inside a parallel BatchExecutor
#   runnable via AtomicInteger.incrementAndGet(). Because the executor runs
#   its tasks in parallel, the id was determined by thread-scheduling order
#   rather than by source order, so the `f<n>.bc <-> method` mapping varied
#   between runs of the same build, and the final `llvm.o` differed
#   byte-for-byte across builds of the same source. That defeated
#   reproducible-build / SCAP-style content-addressing of native artefacts
#   produced via the LLVM IR pipeline.
#
#   The fix dispatches via BatchExecutor.forEach(int, IntFunction) instead,
#   so each runnable receives its list index deterministically. This
#   workflow guards that property mechanically.
#
# Host requirements
# -----------------
#   The LLVM backend is only built on Linux amd64/aarch64/riscv64 and macOS
#   amd64/aarch64. This workflow targets ubuntu-22.04 (x86_64) because
#   that matches the LLVM_TOOLCHAIN distribution the build will download.

name: LLVM Backend Determinism

on:
  push:
    branches: [ master ]
    paths:
      - 'substratevm/src/com.oracle.svm.core.graal.llvm/**'
      - 'substratevm/mx.substratevm/mx_substratevm.py'
      - '.github/workflows/llvm-backend-determinism.yml'
  pull_request:
    paths:
      - 'substratevm/src/com.oracle.svm.core.graal.llvm/**'
      - 'substratevm/mx.substratevm/mx_substratevm.py'
      - '.github/workflows/llvm-backend-determinism.yml'
  workflow_dispatch:
    inputs:
      extra-native-image-args:
        description: 'Extra arguments forwarded to native-image (e.g. -O1)'
        default: ''
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: llvm-backend-determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determinism:
    name: Build + LLVM backend determinism check
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout graal
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up environment variables
        shell: bash
        run: |
          echo "GRAALVM_HOME=${{ github.workspace }}/graalvm" >> ${GITHUB_ENV}
          echo "JAVA_HOME=${{ github.workspace }}/labsjdk" >> ${GITHUB_ENV}
          echo "MX_GIT_CACHE=refcache" >> ${GITHUB_ENV}
          echo "MX_PATH=${{ github.workspace }}/mx" >> ${GITHUB_ENV}
          echo "MX_PYTHON=python3.8" >> ${GITHUB_ENV}
          echo "MX_VERSION=$(jq -r '.mx_version' common.json)" >> ${GITHUB_ENV}
          echo "LANG=en_US.UTF-8" >> ${GITHUB_ENV}

      - name: Checkout graalvm/mx
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: graalvm/mx
          ref: ${{ env.MX_VERSION }}
          path: ${{ env.MX_PATH }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.8'

      - name: Fetch LabsJDK
        shell: bash
        run: |
          mkdir jdk-dl
          ${MX_PATH}/mx --java-home= fetch-jdk --jdk-id labsjdk-ce-latest --to jdk-dl --alias ${JAVA_HOME}

      - name: Build GraalVM with LLVM backend enabled
        shell: bash
        run: |
          cd vm
          MX_ARGS=(
            "--java-home" "${JAVA_HOME}"
            "--dy" "/substratevm"
            "--native-images=native-image"
            "--components=Native Image,Native Image LLVM Backend"
          )
          ${MX_PATH}/mx "${MX_ARGS[@]}" build
          ln -s "$(${MX_PATH}/mx "${MX_ARGS[@]}" graalvm-home)" "${GRAALVM_HOME}"

      - name: Show GraalVM version info
        shell: bash
        run: |
          echo "= 'java --version' ============"
          "${GRAALVM_HOME}/bin/java" --version
          echo "==============================="
          echo "= 'native-image --version' ===="
          "${GRAALVM_HOME}/bin/native-image" --version
          echo "==============================="
          echo "= LLVM toolchain present? ====="
          ls -la "${GRAALVM_HOME}/lib/svm/llvm-bin/" 2>/dev/null \
            | head -20 \
            || echo "(llvm-bin not at the expected path; checking module layer instead)"
          echo "==============================="

      - name: Run llvm-backend-determinism-test
        shell: bash
        run: |
          cd substratevm
          ${MX_PATH}/mx --java-home "${JAVA_HOME}" --dy /substratevm \
            llvm-backend-determinism-test \
            ${{ github.event.inputs.extra-native-image-args || '' }}

      - name: Attribution -- default-backend determinism (informational)
        # Always runs (even when the LLVM test above fails) and never fails the
        # job.  Builds HelloWorld twice with the ORDINARY backend and compares
        # the object files + final binary.  If the default backend is ALSO
        # nondeterministic, the residual divergence is upstream / backend-
        # agnostic (e.g. type-id / reachability nondeterminism) rather than an
        # LLVM-backend regression.  The disassembly diff in the log shows what
        # differs.
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          cd substratevm
          ${MX_PATH}/mx --java-home "${JAVA_HOME}" --dy /substratevm \
            llvm-backend-determinism-test --backend default \
            ${{ github.event.inputs.extra-native-image-args || '' }}

      - name: Upload temp dirs on failure for forensic inspection
        # Runs whenever the determinism test failed; also captures the
        # default-backend attribution output (the informational step above
        # never fails the job, so gate this on always() rather than failure()
        # to make sure the default-backend artefacts come along too).
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: llvm-backend-determinism-artefacts
          # svmbuild_dir(suite) in mx_substratevm.py resolves to
          # suite.get_output_root()/svmbuild, and get_output_root() is
          #     <suite.dir>/mxbuild/jdk<release>[+<release>]*
          # ... so the determinism dirs and the run-{a,b}-hashes.txt
          # full-hash dumps land under
          #     substratevm/mxbuild/jdk*/svmbuild/llvm-backend-determinism-*/
          # The double-glob picks up whichever JDK release directory mx
          # decided to use, plus every variant's output (llvm + default).
          path: |
            substratevm/mxbuild/**/svmbuild/llvm-backend-determinism-*/**
          if-no-files-found: warn
          retention-days: 7
