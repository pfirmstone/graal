# Stage 0 prompt index. Machine-readable manifest of dispatchable prompts.
# Each entry mirrors the prompt frontmatter (schema/prompt.schema.json) for quick scheduling
# without parsing every markdown file. The .md file is authoritative on conflict.
stage: 0
generated_by: bootstrap        # stages 1+ index files are generated_by: R<n-1>
prompts:
  - id: S0.1
    file: S0.1.md
    agent: Scout
    model: sonnet
    effort: low
    deps: []
    validation: local
  - id: S0.2
    file: S0.2.md
    agent: Architect
    model: opus
    effort: high
    deps: [S0.1]
    validation: local
  - id: S0.3
    file: S0.3.md
    agent: Implementer
    model: sonnet
    effort: medium
    deps: [S0.2]
    validation: ci
  - id: S0.4
    file: S0.4.md
    agent: Implementer
    model: sonnet
    effort: high
    deps: [S0.3]
    validation: ci
  - id: S0.5
    file: S0.5.md
    agent: Mechanic
    model: sonnet
    effort: low
    deps: [S0.3]
    validation: local
  - id: S0.6
    file: S0.6.md
    agent: Implementer
    model: sonnet
    effort: medium
    deps: [S0.4, S0.5]
    validation: ci
  - id: S0.7a
    file: S0.7a.md
    agent: Architect
    model: opus
    effort: high
    deps: [S0.2]
    validation: local
  - id: S0.7b
    file: S0.7b.md
    agent: Diagnostician
    model: opus
    effort: high
    deps: [S0.7a]
    validation: ci
  - id: R0
    file: R0.md
    kind: stage-gate-review
    agent: Architect
    model: opus
    effort: high
    deps: [S0.1, S0.3, S0.4, S0.5, S0.6, S0.7b]
    validation: local

# Dispatch order hint (orchestrator derives true ready-set from deps):
#   tick 1: S0.1
#   tick 2: S0.2
#   tick 3: S0.3, S0.7a            (S0.7a unblocked with S0.2; runs parallel to S0.3)
#   tick 4: S0.4, S0.5, S0.7b
#   tick 5: S0.6
#   tick 6: R0   -> writes prompts/stage-1/
